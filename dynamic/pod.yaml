apiVersion: v1
kind: Pod
metadata:
  name: dyn-test
  namespace: demo-app
spec:
  containers:
    - name: app
      image: busybox
      command: ["sh", "-c", "date >> /data/log.txt; sleep 3600"]
      volumeMounts:
        - name: storage
          mountPath: /data
  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: dynamic-pvc