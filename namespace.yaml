apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
  labels:
    team: backend
    environment: production

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-backend-quota
  namespace: demo-app
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "30"
    services: "10"
    configmaps: "30"
    secrets: "30"
    persistentvolumeclaims: "10"

