apiVersion: v1
kind: Namespace
metadata:
  name: netpol-lab
---
apiVersion: v1
kind: Pod
metadata:
  name: backend
  namespace: netpol-lab
  labels:
    app: backend
spec:
  containers:
  - name: web
    image: busybox:1.36
    command: ["sh", "-c"]
    args:
    - echo backend-ok > /tmp/index.html &&
      httpd -f -p 8080 -h /tmp
    ports:
    - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: netpol-lab
spec:
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: netpol-lab
  labels:
    app: frontend
spec:
  containers:
  - name: client
    image: busybox:1.36
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: intrus
  namespace: netpol-lab
  labels:
    app: other
spec:
  containers:
  - name: client
    image: busybox:1.36
    command: ["sleep", "3600"]