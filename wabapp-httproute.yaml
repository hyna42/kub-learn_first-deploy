apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webapp-route
  namespace: demo-app
  labels:
    app: webapp
spec:
  parentRefs:
  - name: main-gateway
    namespace: gateway-system
  hostnames:
  - "webapp-gw.local"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: webapp-service
      port: 80
      